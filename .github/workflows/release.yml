name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stars: ${{ steps.stars.outputs.stars }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="$(node -e "const p=require('fs').readFileSync('Packaging/Info.plist','utf8'); const m=p.match(/CFBundleShortVersionString<\\/key>\\s*<string>([^<]+)/); if(!m)process.exit(1); process.stdout.write(m[1])")"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          test "$(node -p "require('./package.json').version")" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "stars=$(gh api repos/${{ github.repository }} --jq .stargazers_count)" >> "$GITHUB_OUTPUT"

  native-macos:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          certificate="$RUNNER_TEMP/curlman-developer-id.p12"
          keychain="$RUNNER_TEMP/curlman-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
      - name: Configure App Store Connect key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          test -n "$NOTARY_KEY_BASE64"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build, sign, notarize, and verify
        env:
          CURLMAN_SIGN_IDENTITY: 'Developer ID Application: Raunak Singh (22JQ6VAF4X)'
          CURLMAN_NOTARIZE: '1'
          CURLMAN_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          CURLMAN_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          CURLMAN_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          CURLMAN_GITHUB_STARS: ${{ needs.validate.outputs.stars }}
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: |
            outputs/Curlman.dmg
            outputs/Curlman.dmg.sha256
            outputs/Curlman-build.json
          if-no-files-found: error

  electron:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: electron-windows
          - os: ubuntu-latest
            artifact: electron-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make:electron
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/make/**/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [validate, native-macos, electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: find . -type f ! -name '*.sha256' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Curlman ${{ needs.validate.outputs.version }}"
          find release-assets -type f -exec gh release upload "$GITHUB_REF_NAME" {} +
